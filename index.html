function tone(f,d,type='square',v=.04,to,delay=0){if(muted||!AC)return;const o=AC.createOscillator(),a=AC.createGain(),s=AC.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,s);if(to)o.frequency.exponentialRampToValueAtTime(to,s+d);a.gain.setValueAtTime(v,s);a.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(a);a.connect(AC.destination);o.start(s);o.stop(s+d+.03)}
function noise(d,v=.04,f=1200,delay=0){if(muted||!AC)return;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),a=AC.createGain(),st=AC.currentTime+delay;s.buffer=NB;fl.type='lowpass';fl.frequency.value=f;a.gain.setValueAtTime(v,st);a.gain.exponentialRampToValueAtTime(.0001,st+d);s.connect(fl);fl.connect(a);a.connect(AC.destination);s.start(st,Math.random()*.5,d+.03)}
const SFX={
 step:()=>noise(.04,.03,900),
 quake:()=>{noise(.7,.12,300);tone(70,.7,'sawtooth',.08,28);noise(.35,.12,1500,.05);tone(160,.35,'square',.05,40)},
 rumble:()=>{noise(.5,.06,200);tone(55,.5,'triangle',.06,40)},
 jump:()=>{tone(260,.18,'square',.04,640);tone(520,.12,'triangle',.03,900,.04)},
 land:()=>{noise(.09,.06,500);tone(140,.09,'triangle',.06,70)},
 slide:()=>{noise(.35,.045,2600);tone(400,.25,'sawtooth',.012,120)},
 collect:()=>{tone(988,.08,'square',.035);tone(1319,.12,'square',.035,0,.07);tone(1760,.16,'triangle',.04,0,.14)},
 hit:()=>{noise(.45,.1,700);tone(190,.45,'sawtooth',.07,40)},
 start:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.05,0,i*.09)),
 over:()=>[392,349,330,262].forEach((f,i)=>tone(f,.34,'triangle',.06,f*.97,i*.22+.25))};

/* ---------- game logic ---------- */
const TY={tree:{w:18,h:30},fence:{w:28,h:14},garland:{w:40,h:36,top:G-52,s:1},gifts:{w:18,h:24},snowman:{w:16,h:38},icicle:{w:32,h:40,top:G-56,s:1},ball:{w:20,h:20,ex:.8}};
const ORDER=['tree','fence','garland','gifts','snowman','icicle','ball'];
const PC=['#d32f2f','#2f9b46','#2a6fb5','#e6a800'];
const LV=[G+14,G,G-14,G-28];let ter=[{x:-999,g:G,l:1}],lvl=1,qT=900+rnd(500),qW=0,rsp=0;
const gAt=x=>{for(let i=ter.length-1;i>=0;i--)if(ter[i].x<=x)return ter[i].g;return G};
const segAt=x=>{for(let i=ter.length-1;i>=0;i--)if(ter[i].x<=x)return i;return 0};
function okX(x,w,sl){for(let i=1;i<ter.length;i++){const e=ter[i],d=x-e.x;
 if(e.x>x-6&&e.x<x+w+6)return false;
 if(e.l>ter[i-1].l&&d>-50-w&&d<70)return false;
 if(sl&&e.l<ter[i-1].l&&d>-30-w&&d<90)return false}return true}
function addObs(k,x,gy,pop){const d=TY[k];obs.push({k,x,w:d.w,h:d.h,g:gy,top:(d.top||G-d.h)+gy-G,s:d.s,ex:d.ex||0,rot:0,pop:pop?14:0})}
function adorn(d,x,g0,ext,gap){
 if(d.s)for(let i=0;i<3;i++)pres.push({x:x+(d.w-38)/2+8+i*13,y:g0-14,c:PC[rnd(4)],ph:rnd(60)});
 else for(let i=-1;i<=1;i++)pres.push({x:x+ext/2-5+i*15,y:g0-64+Math.abs(i)*8,c:PC[rnd(4)],ph:rnd(60)});
 if(gap&&Math.random()<.8){const n2=2+rnd(2),fy=Math.random()<.7?g0-12:g0-34,fx=x+ext+gap*.35;for(let i=0;i<n2;i++)pres.push({x:fx+i*13,y:fy,c:PC[rnd(4)],ph:rnd(60)})}}
function spawn(){
 const n=Math.min(7,3+(pt/600|0)),k=ORDER[rnd(n)],d=TY[k];let ext=d.w,nl=lvl,rs=false;
 if(pt>240){const r=Math.random();nl=Math.max(0,Math.min(2,lvl+(r<.35?-1:r<.7?1:0)))}
 if(d.s&&nl<lvl)nl=lvl;
 if(nl!==lvl){ter.push({x:W+8,g:LV[nl],l:nl});rs=nl>lvl;lvl=nl}
 const x=W+(rs?95:30),g0=LV[lvl],base=speed*45+60+rnd(50);nextSp=base+(rs?65:0);
 addObs(k,x,g0);
 if(!d.s&&k!=='ball'&&k!=='snowman'&&speed>3&&Math.random()<.3){addObs(k,x+d.w+8,g0);ext=d.w*2+8}
 adorn(d,x,g0,ext,base)}
function boom(o){const C={tree:['#2a7d3f','#3aa150','#ff3b3b','#ffd23f'],snowman:['#fff','#d4e6f0','#222','#ff8a1f'],gifts:['#d32f2f','#2f9b46','#ffd23f','#fff'],fence:['#d32f2f','#fff'],ball:['#fff','#c5def0','#b3d3ea'],garland:['#2f9b46','#ffd23f','#d32f2f','#59c8ff'],icicle:['#a5dcff','#fff','#bfe6ff']}[o.k];
 const cx=o.x+o.w/2,cy=o.top+o.h/2;
 for(let i=0;i<24;i++){const a=Math.random()*6.28,v=1+Math.random()*3.2;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.8,g:.12,l:30+rnd(25),c:C[rnd(C.length)],s:2+rnd(3)})}
 burst(cx,cy,['#fff3a0','#ff9a1f','#fff'],10,2.5,12)}
function quake(){
 const front=Math.random()<.5;let k=front?ter.findIndex((s,j)=>j>0&&s.x>PX+90&&s.x<W):segAt(PX+12);
 if(front&&k<0){const j=segAt(PX+130),b=ter[j];ter.splice(j+1,0,{x:PX+130,g:b.g,l:b.l});k=j+1}
 const s=ter[k],old=s.g;s.l=Math.min(3,s.l+1);s.tg=LV[s.l];if(k===ter.length-1)lvl=s.l;
 const dl=s.tg-old,xe=k+1<ter.length?ter[k+1].x:1e9;
 pres.forEach(p=>{if(p.x>=s.x&&p.x<xe)p.ty=p.y+dl});
 obs.forEach(boom);obs=[];SFX.quake();shake=45;rsp=45}
function respawn(){let x=290,last=x;const n=Math.min(7,3+(pt/600|0));
 for(let c=0;c<2;c++){const k=ORDER[rnd(n)],d=TY[k];let tr=0;while(tr++<14&&!okX(x,d.w,d.s))x+=15;
  const gy=gAt(x+d.w/2);addObs(k,x,gy,x<W-10);adorn(d,x,gy,d.w,0);last=x;x+=180}
 nextSp=Math.max(40,180-(W+30-last))}
function burst(x,y,cols,n,sp,l){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.3,g:.05,l:l+rnd(10),c:cols[rnd(cols.length)],s:1+rnd(2)})}}
function dust(){burst(PX+10,P.y-1,['#fff','#cfe0ea'],6,1.2,14)}
function jump(){if(state!=='play'||P.air)return;P.vy=-5.8;P.air=true;P.sl=false;SFX.jump();dust()}
function slide(on){keys.sl=on;if(!on||state!=='play')return;if(P.air){P.vy=Math.max(P.vy,5.5);return}if(!P.sl){P.sl=true;P.slT=26;SFX.slide()}}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const pbox=()=>P.sl?{x:PX+3,y:P.y-11,w:22,h:11}:{x:PX+6,y:P.y-22,w:12,h:21};
function pop(){const c=$('ctr');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}
function reset(){ter=[{x:-999,g:G,l:1}];lvl=1;rsp=0;qW=0;qT=900+rnd(500);obs=[];pres=[];parts=[];presents=0;pt=0;speed=2.2;nextSp=90;Object.assign(P,{y:G,vy:0,air:false,sl:false,slT:0,land:0});$('cnt').textContent=0;shake=flash=0}
function start(){ac();reset();state='play';$('menu').classList.add('hidden');$('over').classList.add('hidden');SFX.start();['start','again'].forEach(i=>$(i).blur())}
function die(){state='dead';SFX.hit();shake=16;flash=8;const b=pbox();burst(b.x+8,b.y+8,['#fff','#ff5a4d','#ffd23f','#2f9b46'],26,3,30);
 setTimeout(()=>{state='over';SFX.over();if(presents>best){best=presents;try{localStorage.setItem('prBest',best)}catch(e){}}
  $('fin').textContent=presents;$('best2').textContent='Best: '+best;$('over').classList.remove('hidden')},750)}

function step(dt){
 t+=dt;
 for(const f of flakes){f.y+=f.v*dt;f.x+=Math.sin((t+f.p)/30)*.3*dt-(state==='play'?speed*.12:.1)*dt;if(f.y>H){f.y=-3;f.x=Math.random()*W}if(f.x<-3)f.x=W+2}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
 if(shake>0)shake-=dt;if(flash>0)flash-=dt;
 if(state==='menu'){scroll+=.8*dt;P.af+=.09*dt;return}
 if(state!=='play')return;
 pt+=dt;speed=2.2+3*(1-Math.exp(-pt/3600));scroll+=speed*dt;P.af+=speed*.065*dt;
 if(P.sl){P.slT-=dt;if(P.slT<=0&&!keys.sl)P.sl=false;if(Math.random()<.6*dt)parts.push({x:PX+2,y:P.y-2,vx:-speed*.6-Math.random(),vy:-Math.random()*.8,g:.04,l:14,c:'#fff',s:1+rnd(2)})}
 ter.forEach(s=>s.x-=speed*dt);
 ter.forEach((s,i)=>{if(s.tg!=null){const d=s.tg-s.g,m=1.3*dt;if(Math.abs(d)<=m){s.g=s.tg;s.tg=null}else s.g+=Math.sign(d)*m;const e=i+1<ter.length?ter[i+1].x:W,a=Math.max(0,s.x);for(let q=0;q<2;q++)parts.push({x:a+Math.random()*Math.max(0,Math.min(W,e)-a),y:s.g,vx:(Math.random()-.5)*1.5,vy:-Math.random()*1.8,g:.06,l:18+rnd(10),c:'#fff',s:1+rnd(2)})}});while(ter.length>1&&ter[1].x<-20)ter.shift();
 const gp=gAt(PX+12);
 if(P.air){P.vy+=.28*dt;P.y+=P.vy*dt;if(P.vy>=0&&P.y>=gp){P.y=gp;P.vy=0;P.air=false;P.land=8;SFX.land();dust();if(keys.sl){P.sl=true;P.slT=26;SFX.slide()}}}
 else if(P.y<gp-.5){P.air=true;P.vy=0}
 else{P.y=Math.max(gp,P.y-3.5*dt);const fi=(P.af|0)%4;if(fi!==P.lf){if(!P.sl&&(fi===1||fi===3))SFX.step();P.lf=fi}}
 if(P.land>0)P.land-=dt;
 if(rsp>0){rsp-=dt;if(rsp<=0)respawn()}else{nextSp-=speed*dt;if(nextSp<=0)spawn()}
 qT-=dt;if(qT<30&&qT>0){shake=Math.max(shake,2);if(!qW){qW=1;SFX.rumble()}}if(qT<=0&&rsp<=0){quake();qT=1000+rnd(900);qW=0}
 const pb=pbox();
 for(let i=obs.length-1;i>=0;i--){const o=obs[i];o.x-=(speed+o.ex)*dt;if(o.pop>0)o.pop-=dt;if(o.k==='ball'){o.rot+=.14*dt;o.g=gAt(o.x+10);o.top=o.g-o.h}if(o.x<-50){obs.splice(i,1);continue}
  if(hit(pb,{x:o.x+3,y:o.top+3,w:o.w-6,h:o.h-3}))return die()}
 for(let i=pres.length-1;i>=0;i--){const p=pres[i];p.x-=speed*dt;if(p.ty!=null){const d=p.ty-p.y;if(Math.abs(d)<.5){p.y=p.ty;p.ty=null}else p.y+=Math.sign(d)*Math.min(1.3*dt,Math.abs(d))}if(p.x<-20){pres.splice(i,1);continue}
  if(hit(pb,{x:p.x,y:p.y,w:10,h:10})){pres.splice(i,1);presents++;$('cnt').textContent=presents;pop();SFX.collect();
   burst(p.x+5,p.y+5,['#ffd23f','#fff','#ff5a4d','#5ee37a'],10,2,22);parts.push({x:p.x,y:p.y-4,vx:0,vy:-.7,g:0,l:30,tx:'+1'})}}}

function draw(){
 g=main;g.save();if(shake>0){const a=Math.min(6,1+shake/4);g.translate(Math.round((Math.random()-.5)*2*a),Math.round((Math.random()-.5)*2*a))}
 bg();terrain();
 if(state==='menu'){tree(-6,G+4,110,60,true);tree(350,G+4,100,56,true);box(318,G-14,16,14,'#d32f2f');box(300,G-10,14,10,'#2a6fb5');box(330,G-9,12,9,'#2f9b46','#fff');box(24,G-10,14,10,'#e6a800','#d32f2f')}
 obs.forEach(o=>{g.save();g.translate(0,o.g-G);if(o.pop>0){const k=1-o.pop/14;g.globalAlpha=k;if(!o.s){g.translate(o.x+o.w/2,G);g.scale(1,Math.max(.1,k));g.translate(-(o.x+o.w/2),-G)}}outlined(()=>drawObs(o));g.restore()});obs.forEach(tag);
 pres.forEach(p=>{const b=Math.sin((t+p.ph)/10)*1.5;outlined(()=>box(p.x,p.y+3+b,10,7,p.c));if(((t/6|0)+p.ph)%12<2)R(p.x+8,p.y+b+2,2,2,'#fff')});
 if(state!=='dead'&&state!=='over')elf(PX,P.y,P.sl);
 for(const p of parts){if(p.tx){g.globalAlpha=Math.min(1,p.l/15);g.font='bold 10px "Courier New",monospace';g.fillStyle='#000';g.fillText(p.tx,p.x+1,p.y+1);g.fillStyle='#ffd23f';g.fillText(p.tx,p.x,p.y);g.globalAlpha=1}else R(p.x,p.y,p.s,p.s,p.c)}
 flakes.forEach(f=>R(f.x,f.y,f.s,f.s,'#fff'));
 lights();
 if(flash>0){g.fillStyle='rgba(255,60,50,'+flash/16+')';g.fillRect(0,0,W,H)}
 g.restore()}
function icon(){g=icx;icx.clearRect(0,0,12,12);box(1,3,10,8,'#2f9b46','#ffd23f');g=main}

let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(2.5,(ts-last)/16.667||1);last=ts;step(dt);draw();if(ward)portrait(pvc,sel,(t/8|0)%4)}

/* ---------- input & setup ---------- */
addEventListener('keydown',e=>{
 if(ward){if(e.code==='Escape')closeW();else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();pick()}return}
 if(['Space','ArrowUp','ArrowDown','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();
 if(e.repeat)return;
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){if(state==='menu'||state==='over')start();else jump()}
 else if(e.key==='Shift'||e.code==='ArrowDown'||e.code==='KeyS')slide(true);
 else if(e.code==='Enter'&&(state==='menu'||state==='over'))start();
 else if(e.code==='KeyM')tm()});
addEventListener('keyup',e=>{if(e.key==='Shift'||e.code==='ArrowDown'||e.code==='KeyS')slide(false)});
addEventListener('blur',()=>slide(false));
function hold(id,dn,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();ac();dn()});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();up&&up()}))}
hold('bj',jump);hold('bs',()=>slide(true),()=>slide(false));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
function tm(){muted=!muted;$('mute').textContent='SOUND: '+(muted?'OFF':'ON');$('mute').blur()}
$('mute').onclick=tm;$('start').onclick=start;$('again').onclick=start;
function rs(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.width=W*s+'px';wrap.style.height=H*s+'px';wrap.style.fontSize=W*s/50+'px'}
addEventListener('resize',rs);rs();icon();$('best').textContent=best?'Best: '+best:'';
function portrait(c,i,f){const sp=PAL;PAL=pal(i);g=c;c.clearRect(0,0,12,13);const bob=f%2?1:0;
 SP.forEach((r,k)=>row(r,0,1+k-bob,1));row(LEG[f][0],0,11,1);row(LEG[f][1],0,12,1);g=main;PAL=sp}
const grid=$('grid'),pvc=$('pvc').getContext('2d');
CH.forEach((c,i)=>{const b=document.createElement('button');b.className='ci';b.title=c[0];b.innerHTML='<canvas width="12" height="13"></canvas>';
 b.onclick=()=>{sel=i;upd();b.blur()};grid.appendChild(b);portrait(b.firstChild.getContext('2d'),i,0)});
function upd(){[...grid.children].forEach((b,i)=>b.classList.toggle('on',i===sel));$('pvn').textContent=CH[sel][0];$('pvs').textContent=sel===cur?'CURRENT':''}
function openW(){ac();ward=true;sel=cur;upd();document.body.classList.add('inward');$('menu').classList.add('hidden');$('ward').classList.remove('hidden');$('chg').blur()}
function closeW(){ward=false;document.body.classList.remove('inward');$('ward').classList.add('hidden');$('menu').classList.remove('hidden');$('sel').blur();$('back').blur()}
function pick(){cur=sel;PAL=pal(cur);try{localStorage.setItem('prChar',cur)}catch(e){}SFX.collect();closeW()}
$('chg').onclick=openW;$('sel').onclick=pick;$('back').onclick=closeW;
requestAnimationFrame(loop);
try{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;c.getContext('2d').drawImage(im,0,0,180,180);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)};im.src=document.querySelector('link[rel=icon]').href}catch(e){}
})();
</script>
</body></html>
